services:
  minio:
    image: quay.io/minio/minio
    container_name: minio-teste
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - ./data:/data
    command: server /data --console-address ":9001"